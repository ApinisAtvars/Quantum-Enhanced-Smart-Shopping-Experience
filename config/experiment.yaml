# Final Publication Configuration
# Binding source: protocol_final.md (do not edit one without the other)

general:
  base_seed: 42
  seeds: [42, 43, 44, 45, 46]
  num_iterations: 15
  output_dir: "results_final"
  plots_dir: "plots_final"
  logs_dir: "final_logs"

samplers:
  simulated_annealing:
    num_reads: 20
    num_sweeps: 200
    seed: 42
  path_integral:
    num_reads: 20
    seed: 42
  exact:
    max_rank: 10

movielens:
  data_path: "data/u.data"

benchmark:
  reference_subblock: [100, 100]
  rank: 5
  primary_methods:
    - "Repo_ALS"
    - "Repo_SGD"
    - "NBMF_SA"
    - "NBMF_PathIntegral"
  supplemental_methods:
    - "NMF_MU"
  nbmf_iterations: 15
  als_iterations: 15
  sgd_epochs: 15
  repo_als_reg: 0.0
  repo_sgd_lr: 0.01
  repo_sgd_reg: 0.0

correctness:
  sizes:
    - [10, 10]
  ranks: [2, 5]
  methods:
    - "NBMF_Exact"
    - "NBMF_SA"
    - "NBMF_PathIntegral"

convergence:
  synthetic_size: [30, 30]
  ranks: [2, 5, 10]
  methods:
    - "Repo_ALS"
    - "Repo_SGD"
    - "NBMF_SA"
    - "NBMF_PathIntegral"
    - "NBMF_Exact"

scalability:
  synthetic_grid:
    sizes: [[10, 10], [20, 20], [50, 50], [100, 100]]
    ranks: [2, 5, 10]
    samplers: ["simulated_annealing", "path_integral"]
  movielens_grid:
    sizes: [[30, 30], [50, 50], [100, 100]]
    ranks: [2, 5]
    samplers: ["simulated_annealing", "path_integral"]
  scalability_seeds: [42, 43, 44]
  feasibility:
    exact_sizes: [[8, 8], [10, 10], [12, 12], [15, 15]]
    exact_ranks: [2, 5, 10]
    exact_seed: 42
  timeout_seconds: 600
